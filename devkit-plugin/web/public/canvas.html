<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>화면 미리보기 — DevKit</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <a href="/" class="back">← DevKit</a>
    <h1>화면 미리보기 (Canvas)</h1>
    <span class="muted">설계도 한 장을 4 가지로 나눠 보여줍니다 — 읽기 전용</span>
  </header>

  <section class="picker">
    <label>설계도 선택</label>
    <select id="ir-select"><option>불러오는 중…</option></select>
    <button id="reload">다시 불러오기</button>
  </section>

  <nav class="tabs">
    <button class="tab is-active" data-tab="overview">한눈에</button>
    <button class="tab" data-tab="data">데이터</button>
    <button class="tab" data-tab="screens">화면</button>
    <button class="tab" data-tab="workflows">자동화</button>
    <button class="tab" data-tab="critique">자가 점검</button>
  </nav>

  <main class="panes">
    <section id="pane-overview" class="pane is-active">
      <div id="overview-summary" class="muted">설계도를 고르면 한눈에 보여드릴게요.</div>
    </section>

    <section id="pane-data" class="pane">
      <h2>데이터 표 (ERD)</h2>
      <div id="erd" class="diagram">…</div>
    </section>

    <section id="pane-screens" class="pane">
      <h2>화면</h2>
      <div class="row">
        <div class="col">
          <h3>일반 사용자</h3>
          <div id="screens-user" class="screens"></div>
        </div>
        <div class="col">
          <h3>관리자</h3>
          <div id="screens-admin" class="screens"></div>
        </div>
      </div>
    </section>

    <section id="pane-workflows" class="pane">
      <h2>자동화 흐름</h2>
      <div id="bpmn" class="diagram">…</div>
    </section>

    <section id="pane-critique" class="pane">
      <h2>자가 점검 (6 가지 관점)</h2>
      <p class="muted">사용자에게 보여주는 카드와는 다른 내부 점수표입니다(개발자/운영자용).</p>
      <div id="critique-summary"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="/canvas.js" type="module"></script>
</body>
</html>
